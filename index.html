<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi Kota Harmoni: Gim Sosiologi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--cream:#F6F0E1;--paper:#FBF7EC;--sage:#A9B79A;--sd:#6F8266;--teal:#14595A;--td:#0C3F40;--mag:#B3195F;--ink:#1E2F2C;--mut:#51635C;--line:#D9D2BC;--ok:#2E7D5B;--no:#B3195F}
@media(prefers-color-scheme:dark){:root{--cream:#12292A;--paper:#183637;--sage:#7F9473;--sd:#A9B79A;--teal:#7CC9C0;--td:#E8F1E0;--mag:#F0709F;--ink:#F1EBDA;--mut:#B8C6BC;--line:#2C4A49;--ok:#7FD1A8;--no:#F0709F}}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:400 1rem/1.55 Figtree,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;color:var(--td);line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:800}
h2{font-size:1.5rem;font-weight:800}
.scr{display:none;max-width:820px;margin:0 auto;padding:18px}
.scr.on{display:block}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--mag);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer;width:100%;margin-top:14px}
.btn.alt{background:var(--teal);color:#F6F0E1}
.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.hero{background:var(--teal);color:#F6F0E1;border-radius:20px;padding:30px 24px;position:relative;overflow:hidden;margin-bottom:16px}
.hero h1{color:#F6F0E1}.hero p{max-width:50ch;color:#E4EBDD;margin:.3em 0}
.hero::after{content:"";position:absolute;right:-50px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:var(--mag)}
.panel{background:var(--paper);border-radius:16px;padding:20px;border-top:4px solid var(--sd)}
label{display:block;font-weight:600;margin:14px 0 4px;color:var(--td)}
input[type=text],textarea,select{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:10px;background:var(--cream)}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{margin:0;position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:11px;border:2px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg input:checked+span{background:var(--teal);border-color:var(--teal);color:#F6F0E1}
.seg input:focus-visible+span{outline:3px solid var(--mag)}
.hud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;background:var(--teal);color:#F6F0E1;border-radius:14px;padding:10px 16px;font-size:.92rem}
.hud b{font-family:Fraunces,Georgia,serif;font-size:1.05rem}
.map{margin:14px 0}
.map svg{width:100%;height:auto;display:block;border-radius:20px;border:2px solid var(--sd)}
.land{fill:var(--paper)}.river{fill:var(--teal);opacity:.3}.hill{fill:var(--sage)}.tree{fill:var(--sd)}
.wall{fill:var(--cream);stroke:var(--sd);stroke-width:3}.roof,.cas{fill:var(--teal)}.flag{fill:var(--mag)}
.fog ellipse{fill:var(--cream);opacity:.88}.fog{transition:opacity .8s}.cleared .fog{opacity:.1}
.pth{fill:none;stroke:var(--mag);stroke-width:7;stroke-linecap:round;stroke-dasharray:1 16}
.nd{fill:var(--mag);stroke:var(--paper);stroke-width:5}.nd.boss{fill:var(--td)}
.lock .nd{fill:var(--sd)}.lock{opacity:.6}.done .nd{fill:var(--ok)}
.num{fill:#fff;font:800 24px Fraunces,Georgia,serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl,.sml{text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round;pointer-events:none}
.lbl{font:800 27px Fraunces,Georgia,serif;fill:var(--td);stroke-width:7px}
.sml{font:600 20px Figtree,sans-serif;fill:var(--mut);stroke-width:5px}
.zn{cursor:pointer;outline:none}.zn:hover .nd,.zn:focus-visible .nd{stroke:var(--teal);stroke-width:8}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;margin-bottom:12px;font-weight:600;color:var(--mut)}
.top b{color:var(--td);font-family:Fraunces,Georgia,serif}.hp{color:var(--mag);letter-spacing:2px}
.card{background:var(--paper);border-radius:16px;padding:20px;border-top:4px solid var(--teal)}
.card.boss{border-top-color:var(--mag)}
.tag{display:inline-block;background:var(--teal);color:#F6F0E1;font-size:.8rem;font-weight:600;padding:2px 12px;border-radius:99px;margin-bottom:8px}
.boss .tag{background:var(--mag);color:#fff}
.turn{background:var(--cream);border-left:4px solid var(--mag);padding:6px 12px;border-radius:0 8px 8px 0;font-weight:600;margin:0 0 10px}
.ctx{background:var(--cream);border-radius:10px;padding:10px 14px;font-size:.93rem;color:var(--mut)}
.qq{font-size:1.06rem;margin:.3em 0 .8em}
.opt{display:block;width:100%;text-align:left;background:var(--cream);border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 8px;cursor:pointer}
.opt.sm{display:inline-block;width:auto;margin:0 6px 0 0;padding:6px 14px}
.opt.sel{border-color:var(--teal);background:var(--teal);color:#F6F0E1}
.opt.yes,.row.yes,.chip.yes{border-color:var(--ok)!important;box-shadow:inset 4px 0 0 var(--ok)}
.opt.no,.row.no,.chip.no{border-color:var(--no)!important;box-shadow:inset 4px 0 0 var(--no)}
.opt.x{opacity:.6}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.row>span:first-child{flex:1 1 220px}.row select{width:auto;max-width:100%;flex:1 1 200px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;min-height:24px}
.chip{background:var(--cream);border:2px solid var(--sd);border-radius:10px;padding:6px 12px;cursor:pointer;text-align:left}
.chip.on{background:var(--mag);border-color:var(--mag);color:#fff}
.bks{display:grid;gap:10px;margin-top:8px}@media(min-width:620px){.bks{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.bk{min-height:90px;border:2px dashed var(--teal);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.bk b{color:var(--teal)}
.seq{margin:6px 0;padding-left:1.3em}.hint,.fb small{color:var(--mut);font-size:.9rem}
.link{background:none;border:0;color:var(--mag);text-decoration:underline;cursor:pointer}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--cream);border-left:5px solid var(--teal)}
.fb b{display:block}
.big{font:800 3.4rem Fraunces,Georgia,serif;color:var(--mag);line-height:1}
.badge{display:inline-block;background:var(--sage);color:#12292A;border-radius:99px;padding:4px 14px;font-weight:600;margin:3px 6px 3px 0}
.cert{text-align:center;border:3px double var(--sd);border-radius:18px;padding:26px 18px;background:var(--paper)}
.sc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.sc div{background:var(--cream);border-radius:10px;padding:8px 4px;font-size:.85rem}.sc b{display:block;font-size:1.3rem;color:var(--td)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--td);color:var(--cream);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;z-index:9}
#toast.on{opacity:1}
@media print{body{background:#fff}.scr:not(#s-end),.noprint{display:none!important}}
.mtn polygon{fill:var(--sd);opacity:.3}
.deco,.fog,.mtn{pointer-events:none}
.pill{fill:var(--paper);stroke:var(--sd);stroke-width:3}
.lbl{font:800 23px Fraunces,Georgia,serif;fill:var(--td);stroke:none;text-anchor:middle;dominant-baseline:central}
.lbl.s{font:600 17px Figtree,sans-serif}
.zn:hover .pill,.zn:focus-visible .pill{fill:var(--mag);stroke:var(--mag)}
.zn:hover .lbl,.zn:focus-visible .lbl{fill:#fff}
.lock .pill{fill:var(--cream)}
#av{transition:transform 1.1s cubic-bezier(.5,0,.2,1);pointer-events:none}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){#av{transition:none}.bob{animation:none}}
.roof2{fill:var(--mag)}
.cloud{fill:var(--paper);opacity:.9}
.lbl{font-size:28px}.lbl.s{font-size:19px}
.num{font-size:26px}
.ill{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--line)}
.ill.q{max-width:460px;margin:6px auto 12px}
.card>.ill:first-child{margin-bottom:12px}
.hero .ill{margin-top:16px;position:relative;z-index:1;border-color:transparent}
.cert .ill{margin-bottom:14px}
.meds{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0}
.mc{width:96px;font-size:.78rem;line-height:1.2;color:var(--mut)}
.med{width:78px;height:auto;display:block;margin:0 auto 2px}
</style>
</head>

<section id="s-start" class="scr on">
<div class="hero"><h1>Misi Kota Harmoni</h1><p>Kabut Salah Paham menyelimuti Kota Harmoni. Jadilah Sosio-Ranger: taklukkan empat zona interaksi sosial dan usir kabutnya dari Benteng Harmoni.</p><div id="hero-ill"></div></div>
<form id="f" class="panel" autocomplete="off">
<h2>Data pemain</h2>
<label>Kategori permainan</label>
<div class="seg"><label><input type="radio" name="md" value="Individu" checked><span>Individu</span></label><label><input type="radio" name="md" value="Kelompok"><span>Kelompok</span></label></div>
<label for="nm" id="nml">Nama pemain</label>
<input type="text" id="nm" name="nm" required maxlength="40" placeholder="Tulis namamu">
<div id="mw" hidden><label for="ang">Anggota kelompok (satu nama per baris)</label>
<textarea id="ang" name="ang" rows="4" placeholder="Anggota 1&#10;Anggota 2&#10;Anggota 3"></textarea>
<p class="hint">Anggota akan menjawab bergiliran.</p></div>
<label for="kl">Kelas</label>
<input type="text" id="kl" name="kl" required maxlength="20" placeholder="Contoh: X E-1">
<button class="btn" type="submit">Mulai petualangan</button>
</form>
</section>

const go=id=>{document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));scrollTo(0,0)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)};
const total=()=>S.best.reduce((a,b)=>a+(b||0),0);
const open_=i=>i==0||S.best[i-1]>=60;

document.querySelectorAll('[name=md]').forEach(r=>r.onchange=()=>{const g=r.value=='Kelompok'&&r.checked;if(r.checked){$('#mw').hidden=!g;$('#nml').textContent=g?'Nama kelompok':'Nama pemain';$('#nm').placeholder=g?'Tulis nama kelompok':'Tulis namamu'}});
$('#f').onsubmit=e=>{e.preventDefault();const f=e.target;S={name:f.nm.value.trim(),mode:f.md.value,cls:f.kl.value.trim(),mem:f.ang.value.split('\n').map(x=>x.trim()).filter(Boolean),best:[null,null,null,null]};drawMap();go('s-map')};

function drawMap(){
$('#hud').innerHTML='';const a=h('span');a.append(h('b','',S.name),' · '+S.mode+' · Kelas '+S.cls);
$('#hud').append(a,h('span','','Poin: '+total()+' / 400'),h('span','','Lencana: '+(S.best.filter(x=>x>=60).length)+' / 4'));
document.querySelectorAll('.zn').forEach(g=>{const i=+g.dataset.z,ok=open_(i),dn=S.best[i]>=60;g.classList.toggle('lock',!ok);g.classList.toggle('done',dn);g.querySelector('.num').textContent=dn?'✓':ok?i+1:'🔒';g.onclick=()=>ok?intro(i):toast('Lulus zona sebelumnya dengan skor 60 atau lebih dulu.');g.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();g.onclick()}}});
$('#mapbox').classList.toggle('cleared',S.best[3]>=60);
const P=[[135,704],[200,576],[500,466],[190,336],[480,164]],k=S.best.findIndex(x=>!(x>=60)),at=k<0?4:k;
$('#av').style.transform='translate('+P[at][0]+'px,'+P[at][1]+'px) scale(1.25)'}

function intro(i){S.z=i;S.lives=3;S.pts=0;S.qi=0;const z=Z[i],p=$('#s-play');p.innerHTML='';
const c=h('div','card'+(z.boss?' boss':''));c.append(scene(z.ib,400,150,118),h('h2','','Zona '+(i+1)+': '+z.n),h('p','','Misi utama: '+z.mi),h('p','','Imbalan: lencana '+z.b+' dan 100 poin.'),h('p','hint','3 nyawa (♥). Jawaban yang kurang dari setengah benar mengurangi 1 nyawa. Lulus jika skor 60 atau lebih.'));
if(z.boss)c.append(h('p','ctx',CASE));
const b=h('button','btn','Mulai misi');b.onclick=ask;const k=h('button','link','Kembali ke peta');k.onclick=()=>go('s-map');c.append(b,k);p.append(c);go('s-play')}

function ask(){const z=Z[S.z],q=z.q[S.qi],w=q.w||25,p=$('#s-play'),last=S.qi==z.q.length-1;p.innerHTML='';
const top=h('div','top');top.innerHTML='<b></b><span>Soal '+(S.qi+1)+'/'+z.q.length+'</span><span class="hp">'+'♥'.repeat(S.lives)+'♡'.repeat(3-S.lives)+'</span><span>'+S.pts+' poin</span>';top.firstChild.textContent=z.n;
const c=h('div','card'+(z.boss?' boss':''));
if(S.mode=='Kelompok'&&S.mem.length)c.append(h('p','turn','Giliran menjawab: '+S.mem[S.qi%S.mem.length]));
c.append(h('span','tag',TY[q.t]+' · '+w+' poin'));if(q.il)c.append(scene(q.il,300,120,92,'q'));
if(z.boss)c.append(h('p','ctx',CASE));
c.append(h('p','qq',q.q));const b=h('div');c.append(b);
const r=R[q.t=='pgk'?'pg':q.t](q,b,q.t=='pgk'),btn=h('button','btn','Periksa jawaban');let done=0;
btn.onclick=()=>{if(!done){if(!r.ok())return toast('Lengkapi jawabanmu dulu.');b.dataset.lock=1;const f=r.get(),pt=Math.round(w*f);S.pts+=pt;if(f<.5)S.lives--;r.show();done=1;
const fb=h('div','fb');fb.append(h('b','',(f==1?'Tepat sekali! ':f>0?'Sebagian benar. ':'Belum tepat. ')+'+'+pt+' poin'+(f<.5?' (−1 nyawa)':'')),h('small','','Kunci: '+q.k));c.insertBefore(fb,btn);
btn.textContent=(last||S.lives<=0)?'Lihat hasil zona':'Lanjut'}
else{if(last||S.lives<=0)result();else{S.qi++;ask()}}};
c.append(btn);p.append(top,c);scrollTo(0,0)}

function result(){const z=Z[S.z],ok=S.pts>=60,p=$('#s-play');S.best[S.z]=Math.max(S.best[S.z]||0,S.pts);p.innerHTML='';
const c=h('div','card'+(z.boss?' boss':''));c.style.textAlign='center';
c.append(scene(ok?PASS:FAIL,400,150,118),h('p','hint','Skor zona '+z.n),h('div','big',String(S.pts)),h('p','',ok?'Zona selesai! Kamu meraih lencana '+z.b+'.':(S.lives<=0?'Nyawa habis. ':'Skor belum mencapai 60. ')+'Masuk Kamp Latihan dulu.'));
if(!ok){const s=h('div','fb');s.style.textAlign='left';s.append(h('b','','Kartu ringkasan Kamp Latihan'),h('span','',z.s));c.append(s)}
if(ok)c.append(medal(S.z));const b=h('button','btn',ok?(z.boss?'Lihat hasil akhir':'Kembali ke peta'):'Ulangi zona');
b.onclick=()=>ok?(z.boss?fin():(drawMap(),go('s-map'))):intro(S.z);c.append(b);
if(!ok){const k=h('button','link','Kembali ke peta');k.onclick=()=>{drawMap();go('s-map')};c.append(k)}
p.append(c);scrollTo(0,0)}

function fin(){const t=total(),pc=t/4,rk=pc>=85?'Sosio-Ranger Emas':pc>=70?'Sosio-Ranger Perak':'Sosio-Ranger Perunggu',e=$('#s-end');e.innerHTML='';
const c=h('div','cert');c.append(scene(WIN,400,150,118),h('p','hint','Kabut Salah Paham telah terusir. Kota Harmoni kembali rukun!'),h('h1','','Selamat, '+S.name+'!'),h('p','',S.mode+' · Kelas '+S.cls+(S.mode=='Kelompok'&&S.mem.length?' · Anggota: '+S.mem.join(', '):'')),h('div','big',t+' / 400'),h('h2','',rk));
const sc=h('div','sc');Z.forEach((z,i)=>{const d=h('div');d.append(h('b','',String(S.best[i]||0)),z.n);sc.append(d)});c.append(sc);
const ms=h('div','meds');Z.forEach((z,i)=>ms.append(medal(i)));c.append(ms);
c.append(h('p','hint','Refleksi: satu perilaku apa yang akan kamu lakukan minggu ini agar interaksi di sekitarmu makin harmonis?'));
const pr=h('button','btn noprint','Cetak atau simpan sertifikat');pr.onclick=()=>print();
const ag=h('button','btn alt noprint','Main lagi');ag.onclick=()=>location.reload();
e.append(c,pr,ag);go('s-end')}
</script>
</body>
</html>
